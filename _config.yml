# Site settings
title: Grant Henderson
description: >-
  Security tooling, cloud research, and project writeups.
url: "https://grant-henderson.github.io"
lang: en
timezone: Pacific/Auckland

author: Grant Henderson

github:
  username: Grant-Henderson

# jekyll-theme-console
theme: jekyll-theme-console
style: dark   # dark (grey-on-black console) | light | hacker | nord

plugins:
  - jekyll-seo-tag

# Top navigation (right-aligned in the console header)
header_pages:
  - about.md
  - projects.md

permalink: /posts/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - LICENSE
