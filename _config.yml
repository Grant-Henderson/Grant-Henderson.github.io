# Site
title: "Grant Henderson"
name: "Grant Henderson"
description: >-
  Security tooling, cloud research, and project writeups.
url: "https://grant-henderson.github.io"
locale: "en-US"
timezone: Pacific/Auckland
repository: "Grant-Henderson/Grant-Henderson.github.io"

# Theme
theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "cyber"   # custom green-on-dark skin (in _sass)
search: true

# Author sidebar
author:
  name: "Grant Henderson"
  avatar: "https://avatars.githubusercontent.com/Grant-Henderson"
  bio: "Cybersecurity student — cloud security (AWS & Entra ID) and security tooling."
  location: "New Zealand"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Grant-Henderson"

# Footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Grant-Henderson"

include:
  - _pages

plugins:
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

permalink: /posts/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: false
      related: true
      comments: false
      toc: true
      toc_sticky: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - LICENSE
